name: offline_first_app
description: Offline-first product catalog using DummyJSON API.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Architecture
  stacked: ^3.5.0
  stacked_services: ^1.6.0

  # UI
  flutter_screenutil: ^5.9.3
  iconsax: ^0.0.8
  cached_network_image: ^3.4.1
  google_nav_bar: ^5.0.7

  # Networking
  dio: ^5.4.0
  dio_smart_retry: ^7.0.1

  # Local Database
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.32

  # Code Generation (runtime support)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Connectivity
  connectivity_plus: ^6.1.4

  # Background Tasks
  workmanager: ^0.9.0

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  stacked_generator: ^2.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

  # Code generation
  drift_dev: ^2.24.0
  freezed: ^3.0.4
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
