name: offline_first_app
description: Offline-first teacher app with SQLCipher encryption and sync agent.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.3

  # Local database (SQLCipher encrypted)
  drift: ^2.24.0
  sqlcipher_flutter_libs: ^0.6.6
  sqlite3: ^2.4.6

  # HTTP client + offline caching
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0

  # Connectivity
  connectivity_plus: ^6.1.4
  flutter_offline: ^5.0.0

  # Secure storage (encryption key + auth tokens)
  flutter_secure_storage: ^9.2.2

  # Background sync
  workmanager: ^0.9.0

  # Domain models (code generation runtime)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  flutter_screenutil: ^5.9.3
  iconsax: ^0.0.8
  cached_network_image: ^3.4.1
  google_nav_bar: ^5.0.7

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.4.3
  drift_dev: ^2.24.0
  freezed: ^3.0.4
  json_serializable: ^6.9.5

  # Linting
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
